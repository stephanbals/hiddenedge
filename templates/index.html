    <title>
        HiddenEdge — AI Career Intelligence Platform
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #172554 0%,
                    #020617 45%
                ),
                #020617;

            color: white;

            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }

        /* =========================================
           BACKGROUND EFFECTS
        ========================================= */

        .glow {

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(99,102,241,0.12);

            filter: blur(120px);

            z-index: 0;
        }

        .glow.left {
            top: -120px;
            left: -120px;
        }

        .glow.right {
            bottom: -120px;
            right: -120px;
        }

        /* =========================================
           MAIN WRAPPER
        ========================================= */

        .wrapper {

            position: relative;

            z-index: 2;

            max-width: 1450px;

            margin: auto;

            padding:
                40px
                32px
                80px;
        }

        /* =========================================
           HERO
        ========================================= */

        .hero {

            display: grid;

            grid-template-columns:
                1.15fr
                0.85fr;

            gap: 50px;

            align-items: center;
        }

        /* =========================================
           LEFT HERO
        ========================================= */

        .hero-left {

            padding-top: 20px;
        }

        .brand {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 35px;
        }

        .brand img {

            width: 62px;

            filter:
                drop-shadow(
                    0 0 18px rgba(99,102,241,0.45)
                );
        }

        .brand h1 {

            margin: 0;

            font-size: 40px;

            font-weight: 700;
        }

        .tag {

            display: inline-block;

            margin-bottom: 24px;

            padding:
                10px
                16px;

            border-radius: 999px;

            background:
                rgba(59,130,246,0.12);

            border:
                1px solid rgba(59,130,246,0.22);

            color: #7dd3fc;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .headline {

            font-size: 72px;

            line-height: 1.05;

            font-weight: 800;

            margin-bottom: 30px;

            max-width: 780px;
        }

        .headline span {

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #3b82f6
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .subtext {

            font-size: 24px;

            line-height: 1.7;

            color: #cbd5e1;

            max-width: 760px;

            margin-bottom: 42px;
        }

        .benefits {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 22px;

            margin-bottom: 55px;
        }

        .benefit {

            background:
                rgba(15,23,42,0.72);

            border:
                1px solid rgba(255,255,255,0.06);

            border-radius: 22px;

            padding: 22px;

            backdrop-filter: blur(14px);
        }

        .benefit h3 {

            margin-top: 0;

            margin-bottom: 10px;

            font-size: 20px;
        }

        .benefit p {

            margin: 0;

            color: #94a3b8;

            line-height: 1.6;

            font-size: 15px;
        }

        .robots {

            display: flex;

            justify-content: center;

            gap: 28px;

            margin-top: 10px;
        }

        .robots img {

            width: 170px;

            filter:
                drop-shadow(
                    0 0 30px rgba(59,130,246,0.28)
                );

            transition:
                transform 0.25s ease;
        }

        .robots img:hover {

            transform:
                translateY(-6px);
        }

        /* =========================================
           RIGHT HERO CARD
        ========================================= */

        .hero-card {

            background:
                linear-gradient(
                    180deg,
                    rgba(15,23,42,0.94),
                    rgba(2,6,23,0.96)
                );

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 34px;

            padding: 42px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.38);

            backdrop-filter: blur(18px);
        }

        .hero-card h2 {

            margin-top: 0;

            font-size: 46px;

            line-height: 1.15;

            margin-bottom: 22px;
        }

        .hero-card h2 span {

            color: #8b5cf6;
        }

        .hero-card p {

            color: #cbd5e1;

            line-height: 1.8;

            font-size: 18px;
        }

        .checklist {

            margin-top: 30px;

            display: flex;

            flex-direction: column;

            gap: 16px;
        }

        .check {

            display: flex;

            align-items: center;

            gap: 14px;

            color: #e2e8f0;

            font-size: 17px;
        }

        .check-icon {

            width: 26px;
            height: 26px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 14px;

            font-weight: bold;
        }

        .cta-btn {

            width: 100%;

            margin-top: 38px;

            padding:
                20px
                24px;

            border: none;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #9333ea
                );

            color: white;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease;
        }

        .cta-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 40px rgba(99,102,241,0.34);
        }

        .trial {

            margin-top: 16px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
        }

        .trust-box {

            margin-top: 34px;

            padding: 22px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.03);

            border:
                1px solid rgba(255,255,255,0.06);

            color: #cbd5e1;

            line-height: 1.7;
        }

        .coming {

            margin-top: 34px;
        }

        .coming h4 {

            margin-bottom: 18px;

            color: #8b5cf6;

            font-size: 18px;
        }

        .coming-grid {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 14px;
        }

        .coming-item {

            background:
                rgba(255,255,255,0.03);

            padding: 14px;

            border-radius: 14px;

            color: #cbd5e1;

            font-size: 14px;
        }

        .contact {

            margin-top: 40px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
        }

        .contact a {

            color: #60a5fa;
        }

        footer {

            margin-top: 80px;

            text-align: center;

            color: #64748b;

            font-size: 14px;
        }

    </style>
