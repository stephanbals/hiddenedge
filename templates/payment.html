<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        HiddenEdge — Upgrade Required
    </title>

    <style>

        body {

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;
        }

        .card {

            width: 420px;

            background: #1e293b;

            border-radius: 18px;

            padding: 40px;

            box-sizing: border-box;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.35);
        }

        h1 {

            margin-top: 0;

            font-size: 30px;
        }

        p {

            color: #cbd5e1;

            line-height: 1.6;
        }

        .highlight {

            color: #22c55e;

            font-weight: bold;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            background:
                linear-gradient(
                    45deg,
                    #6366f1,
                    #9333ea
                );

            color: white;
        }

        button:hover {

            opacity: 0.92;
        }

        .small {

            margin-top: 18px;

            font-size: 13px;

            color: #94a3b8;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>
        Upgrade Required
    </h1>

    <p>

        You have used your
        <span class="highlight">
            3 free HiddenEdge analyses
        </span>.

    </p>

    <p>

        Upgrade to continue using:

    </p>

    <p>

        • Unlimited CV analyses<br>
        • Unlimited CV tailoring<br>
        • DOCX exports<br>
        • Advanced role matching<br>
        • Premium recruiter insights

    </p>

    <button onclick="goToStripe()">

        Subscribe — €9/month

    </button>

    <div class="small">

        Cancel anytime.

    </div>

</div>

<script>

function goToStripe() {

    const email =
        localStorage.getItem(
            "hiddenedge_email"
        ) || "";

    fetch(
        "/create-checkout-session",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                email: email
            })
        }
    )

    .then(res => res.json())

    .then(data => {

        if (data.url) {

            window.location.href =
                data.url;

        } else {

            alert(
                "Stripe checkout failed."
            );
        }
    })

    .catch(err => {

        console.error(err);

        alert(
            "Stripe checkout failed."
        );
    });
}

</script>

</body>
</html>
