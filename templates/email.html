<!DOCTYPE html>
<html>
<head>

    <title>
        HiddenEdge - Login
    </title>

    <style>

        body {

            font-family: Arial;

            background:#0f172a;

            color:white;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            margin:0;
        }

        .card {

            background:#1e293b;

            padding:30px;

            border-radius:10px;

            width:400px;

            text-align:center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.35);
        }

        h2 {

            margin-top:0;
        }

        input {

            width:100%;

            padding:12px;

            margin-top:15px;

            border-radius:6px;

            border:none;

            box-sizing:border-box;

            font-size:15px;
        }

        button {

            width:100%;

            padding:12px;

            margin-top:15px;

            border:none;

            border-radius:8px;

            background:
                linear-gradient(
                    45deg,
                    #6366f1,
                    #9333ea
                );

            color:white;

            cursor:pointer;

            font-size:15px;

            font-weight:bold;
        }

        button:hover {

            opacity:0.92;
        }

        .error {

            color:#ff6b6b;

            margin-top:14px;

            min-height:20px;
        }

        .subtext {

            margin-top:12px;

            font-size:14px;

            color:#cbd5e1;

            line-height:1.5;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>
        HiddenEdge
    </h2>

    <div class="subtext">

        Continue to your
        Career Intelligence workspace.

    </div>

    <input
        id="emailInput"
        type="email"
        placeholder="you@example.com"
    >

    <button onclick="submitEmail()">

        Continue

    </button>

    <div id="error"
         class="error">
    </div>

</div>

<script>

async function submitEmail() {

    const email =
        document
            .getElementById(
                "emailInput"
            )
            .value
            .trim();

    if (!email) {

        document
            .getElementById("error")
            .innerText =
                "Please enter email";

        return;
    }

    try {

        const response =
            await fetch(
                "/submit-email",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email: email
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            document
                .getElementById("error")
                .innerText =
                    data.error ||
                    "Login failed";

            return;
        }

        /* =========================================
           STORE EMAIL LOCALLY
        ========================================= */

        localStorage.setItem(
            "hiddenedge_email",
            email
        );

        /* =========================================
           REDIRECT FLOW
        ========================================= */

        if (
            data.access === "paywall"
        ) {

            window.location.href =
                "/payment";

        } else {

            window.location.href =
                "/app";
        }

    } catch (err) {

        console.error(err);

        document
            .getElementById("error")
            .innerText =
                "Something went wrong";
    }
}

</script>

</body>
</html>
