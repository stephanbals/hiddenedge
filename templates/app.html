<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HiddenEdge</title>

<style>
body { margin:0; font-family:Arial; background:#020617; color:white; }
.wrapper { display:flex; height:100vh; }
.left { width:300px; padding:20px; background:#0b1220; }
.right { flex:1; padding:20px; overflow:auto; }

.card { background:#111827; padding:18px; border-radius:12px; margin-bottom:15px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }

.robot { width:60px; }

button {
    padding:10px;
    margin-top:10px;
    background:#3b82f6;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

.secondary { background:#1e293b; }

textarea {
    width:100%;
    margin-top:8px;
    background:#020617;
    color:white;
    border:1px solid #334155;
    border-radius:6px;
    padding:8px;
}

.hidden { display:none; }

.progress-bar {
    height:6px;
    background:#1e293b;
    border-radius:5px;
    margin-top:6px;
}

.progress-fill {
    height:100%;
    width:0%;
    background:#22c55e;
    border-radius:5px;
}

.green { color:#22c55e; }
.yellow { color:#f59e0b; }
.red { color:#ef4444; }

.badge {
    display:inline-block;
    padding:4px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.pass { background:#065f46; color:#22c55e; }
.reject { background:#7f1d1d; color:#ef4444; }
.borderline { background:#78350f; color:#f59e0b; }
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT -->
<div class="left">

<h2>HiddenEdge</h2>
<img src="/static/helper.png" class="robot">

<p style="font-size:13px;opacity:0.8;">
1. Upload your CV<br>
2. Paste job description<br>
3. Click Analyze
</p>

<input type="file" id="files"><br><br>
<textarea id="job_text" placeholder="Paste job description..."></textarea>

<button onclick="analyze()">Analyze My Fit</button>

<div class="card">
Upload
<div class="progress-bar"><div id="uploadBar" class="progress-fill"></div></div>

Analyze
<div class="progress-bar"><div id="analyzeBar" class="progress-fill"></div></div>

Tailor
<div class="progress-bar"><div id="tailorBar" class="progress-fill"></div></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="card">
<h3>ATS Evaluation</h3>
<div id="atsBlock"></div>
</div>

<div class="grid">

<div class="card">
<img src="/static/nestor.png" class="robot">
<h3>Recruiter Evaluation</h3>
<div id="recruiterText"></div>
</div>

<div class="card">
<img src="/static/alec.png" class="robot">
<h3>Hiring Manager Evaluation</h3>
<div id="managerText"></div>
</div>

</div>

<div class="card hidden" id="helperCTA">
<p>Answer questions to improve your match?</p>
<button onclick="showQuestions()">Yes</button>
<button class="secondary" onclick="decline()">No</button>
</div>

<div class="card hidden" id="questionsBlock">
<h3>Questions</h3>
<div id="questionsContainer"></div>
<button onclick="submitAnswers()">Submit</button>
</div>

<div class="card hidden" id="evaluationBlock">
<h3>Re-evaluation</h3>
<div id="evaluationContent"></div>
</div>

<div class="card hidden" id="improveCTA">
<p>Improve your CV?</p>
<button onclick="generateCV()">Yes</button>
<button class="secondary" onclick="decline()">No</button>
</div>

<div class="card hidden" id="cvBlock">
<h3>Improved CV</h3>
<pre id="cvOutput"></pre>

<div id="scoreBlock" style="margin-top:15px;"></div>

</div>

</div>
</div>

<script>

let baseScore = 0;
let questionsData = [];
let storedTexts = [];

function setProgress(id,val){
    document.getElementById(id).style.width = val+"%";
}

function getBadge(decision){
    if(!decision) return "";
    decision = decision.toLowerCase();
    if(decision.includes("pass")) return '<span class="badge pass">PASS</span>';
    if(decision.includes("reject")) return '<span class="badge reject">REJECT</span>';
    return '<span class="badge borderline">BORDERLINE</span>';
}

async function analyze(){

    let form=new FormData();
    let file=document.getElementById("files").files[0];

    if(!file){
        alert("Upload CV");
        return;
    }

    setProgress("uploadBar",100);
    setProgress("analyzeBar",40);

    form.append("files",file);
    form.append("job_text",job_text.value);

    let res=await fetch("/analyze",{method:"POST",body:form});

    if(res.status===402){
        alert("You have reached your free limit. Please upgrade.");
        return;
    }

    let data=await res.json();

    setProgress("analyzeBar",100);

    baseScore = data.fit_score || 0;
    storedTexts = data.texts || [];

    renderATS(data.ats_analysis || {});
    renderRecruiter(data.recruiter_view || {});
    renderManager(data.hiring_manager_view || {});

    questionsData = data.questions || [];

    helperCTA.classList.remove("hidden");
}

function renderATS(ats){

    let html = `
    <b>Score:</b> ${ats.score || "N/A"}%<br><br>
    <b>Domain:</b> ${ats.domain || ""}<br>
    <b>Role:</b> ${ats.role || ""}<br><br>
    `;

    (ats.matches || []).forEach(m=>{
        html+=`
        <div>
        <b>${m.requirement || ""}</b><br>
        Match: ${m.match || ""}<br>
        Evidence: ${m.evidence || "No evidence"}<br>
        Gap: ${m.gap || ""}
        </div><br>`;
    });

    atsBlock.innerHTML = html;
}

function renderRecruiter(r){

    recruiterText.innerHTML = `
    ${getBadge(r.screening_decision || "")}<br><br>

    <b>Reasoning:</b><br>
    ${r.reasoning || "No reasoning available"}<br><br>

    <b>Red Flags:</b><br>
    ${(r.red_flags || []).map(x => "• " + x).join("<br>")}<br><br>

    <b>Shortlist Probability:</b> ${r.shortlist_probability || "N/A"}
    `;
}

function renderManager(h){

    managerText.innerHTML = `
    <b>Execution Readiness:</b><br>${h.execution_readiness || "N/A"}<br><br>
    <b>Impact Potential:</b><br>${h.impact_potential || "N/A"}<br><br>

    <b>Risks:</b><br>
    ${(h.risks || []).map(x => "• " + x).join("<br>")}<br><br>

    <b>Final Decision:</b><br>
    ${h.final_decision || "N/A"}
    `;
}

function showQuestions(){
    helperCTA.classList.add("hidden");
    questionsBlock.classList.remove("hidden");

    questionsContainer.innerHTML = (questionsData || []).map((q,i)=>`
        <div>${q}<textarea id="q_${i}"></textarea></div>
    `).join("");
}

async function submitAnswers(){

    let answers = questionsData.map((_,i)=>
        document.getElementById("q_"+i).value
    );

    let res = await fetch("/evaluate_answers",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            base_score: baseScore,
            answers: answers.join(" ")
        })
    });

    let data = await res.json();

    evaluationBlock.classList.remove("hidden");

    evaluationContent.innerHTML = `
    <b>Original:</b> ${data.base_score}%<br>
    <b>Improvement:</b> +${data.improvement}%<br>
    <b>New:</b> ${data.new_score}%<br><br>

    ${(data.improvement_factors || []).map(f => "• " + f).join("<br>")}
    `;

    scoreBlock.innerHTML = `
    <b>Original:</b> ${data.base_score}%<br>
    <b>Improvement:</b> +${data.improvement}%<br>
    <b>New:</b> ${data.new_score}%
    `;

    improveCTA.classList.remove("hidden");
}

function generateCV(){

    setProgress("tailorBar", 100);

    let preview = storedTexts.join("\n").substring(0,800);

    cvBlock.classList.remove("hidden");

    cvOutput.innerHTML = `
    <div style="filter:blur(5px); opacity:0.6;">
        ${preview.replace(/\n/g,"<br>")}
    </div>

    <br>

    <div style="background:#020617;padding:15px;border-radius:10px;border:1px solid #334155;">
        <b style="font-size:16px;">🔒 Unlock your optimized CV</b><br><br>

        <div style="opacity:0.8;font-size:14px;">
        ✔ ATS-optimized bullet points<br>
        ✔ Stronger positioning vs other candidates<br>
        ✔ Higher interview probability<br>
        ✔ Ready-to-send professional format
        </div>

        <br>

        <button onclick="goToCheckout()" style="width:100%;font-size:16px;">
            🚀 Unlock Full CV — €9/month
        </button>

        <div style="margin-top:8px;font-size:12px;opacity:0.6;">
        Instant access • Cancel anytime
        </div>
    </div>
    `;
}

async function goToCheckout(){

    try{
        let res = await fetch("/create-checkout-session", { method:"POST" });
        let data = await res.json();

        if(data.url){
            window.location.href = data.url;
        }else{
            alert("Payment system error.");
        }

    }catch(e){
        alert("Stripe connection error.");
    }
}

function decline(){
    location.reload();
}

</script>

</body>
</html>
