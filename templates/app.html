<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HiddenEdge</title>

<style>
body { margin:0; font-family: Arial; background:#0b1220; color:white; }
.layout { display:flex; }
.sidebar { width:260px; background:#0a1a33; padding:20px; min-height:100vh; }
.main { flex:1; padding:20px; }

textarea { width:100%; height:150px; margin-top:10px; }

button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background: linear-gradient(90deg,#5f6cff,#7b4dff);
    color:white;
    cursor:pointer;
}

.card {
    background:#0f1f3d;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

input.answer {
    width:100%;
    margin-top:5px;
    padding:8px;
    border-radius:6px;
    border:none;
}

pre {
    white-space: pre-wrap;
    background:#081020;
    padding:15px;
    border-radius:10px;
    max-height:400px;
    overflow:auto;
}
</style>
</head>

<body>

<div class="layout">

<div class="sidebar">
<h2>HiddenEdge</h2>

<input type="file" id="cvFiles" multiple>
<textarea id="jobText" placeholder="Paste job description"></textarea>

<button id="analyzeBtn" onclick="analyze()">Analyze CV Fit</button>
<button onclick="findJobs()">Find Jobs</button>

<button onclick="handleSubscription()">
🔓 Get Full Access — €9/month
</button>
</div>

<div class="main">

<div class="card">
<h2>Overall Match Score CV to Job Description (Now)</h2>
<div id="score">--%</div>
</div>

<div class="card">
<h2>ATS Evaluation</h2>
<div id="ats"></div>
</div>

<div class="card">
<h2>Recruiter</h2>
<div id="recruiter"></div>
</div>

<div class="card">
<h2>Hiring Manager</h2>
<div id="manager"></div>
</div>

<div class="card">
<h2>Improve Your Chances</h2>
<div id="improvement"></div>
</div>

<div class="card">
<h2>Improved CV Preview</h2>
<div id="cvPreview"></div>
<button id="downloadBtn" style="display:none;" onclick="downloadCV()">Download CV</button>
</div>

<div class="card">
<h2>Jobs</h2>
<div id="jobs"></div>
</div>

</div>
</div>

<script>

let lastQuestions = [];
let lastCVFiles = null;
let lastJobText = "";

// ==========================
// ANALYZE
// ==========================
function analyze(){

    const files = document.getElementById("cvFiles").files;
    const jobText = document.getElementById("jobText").value;

    if(files.length === 0){
        alert("Upload CV first");
        return;
    }

    lastCVFiles = files;
    lastJobText = jobText;

    const fd = new FormData();
    for(let f of files){ fd.append("files", f); }
    fd.append("job_text", jobText);

    const btn = document.getElementById("analyzeBtn");
    btn.innerText = "Working...";
    btn.disabled = true;

    setTimeout(()=>{
        if(btn.disabled){
            btn.innerText = "May take up to 60 seconds...";
        }
    }, 5000);

    fetch("/analyze", {
        method:"POST",
        body: fd
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("score").innerText =
            (data.fit_score ?? "--") + "%";

        renderATS(data.ats_analysis);
        renderRecruiter(data.recruiter_view);
        renderManager(data.hiring_manager_view);
        renderImprovement(data.improvement_summary, data.questions);

    })
    .finally(()=>{
        btn.innerText = "Analyze CV Fit";
        btn.disabled = false;
    });
}

// ==========================
// ATS
// ==========================
function renderATS(data){
    if(!data || !data.matches) return;

    document.getElementById("ats").innerHTML = `
        <ul>
        ${data.matches.map(m=>{

            let color = m.match==='yes'?'lightgreen':
                        m.match==='partial'?'orange':'salmon';

            let label = m.match==='yes'
                ? "Found in CV:"
                : m.match==='partial'
                ? "Partially Present In CV:"
                : "Not Found In CV:";

            return `
                <li style="color:${color}">
                    <b>${label}</b> ${m.requirement}<br>
                    <small>${m.evidence || m.gap || ""}</small>
                </li>
            `;
        }).join("")}
        </ul>
    `;
}

// ==========================
// RECRUITER
// ==========================
function renderRecruiter(data){
    if(!data){
        document.getElementById("recruiter").innerText = "No data";
        return;
    }

    document.getElementById("recruiter").innerHTML = `
        <b>${data.screening_decision}</b>
        <p>${data.overall_impression || ""}</p>
        <p>${data.decision_rationale}</p>
    `;
}

// ==========================
// MANAGER
// ==========================
function renderManager(data){
    if(!data){
        document.getElementById("manager").innerText = "No data";
        return;
    }

    document.getElementById("manager").innerHTML = `
        <b>${data.final_decision}</b>
        <p>${data.execution_readiness || ""}</p>
        <p>${data.decision_rationale}</p>
    `;
}

// ==========================
// IMPROVEMENT + QUESTIONS
// ==========================
function renderImprovement(text, questions){

    lastQuestions = questions || [];

    let html = `<p>${text || ""}</p>`;

    if(lastQuestions.length > 0){

        html += `<h4>Answer these to improve your CV:</h4>`;

        lastQuestions.forEach((q, i)=>{
            html += `
                <div>
                    <p>${q}</p>
                    <input class="answer" id="q_${i}" placeholder="Your answer...">
                </div>
            `;
        });

        html += `<button onclick="submitAnswers()">Improve CV</button>`;
    }

    document.getElementById("improvement").innerHTML = html;
}

// ==========================
// SUBMIT ANSWERS → REFINE CV
// ==========================
function submitAnswers(){

    const answers = [];

    lastQuestions.forEach((q, i)=>{
        const val = document.getElementById(`q_${i}`).value;
        if(val) answers.push(val);
    });

    if(answers.length === 0){
        alert("Please answer at least one question");
        return;
    }

    const fd = new FormData();

    for(let f of lastCVFiles){ fd.append("files", f); }
    fd.append("job_text", lastJobText);

    answers.forEach(a => fd.append("answers", a));

    fetch("/refine", {
        method:"POST",
        body: fd
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("cvPreview").innerHTML =
            `<pre>${data.cv}</pre>`;

        document.getElementById("downloadBtn").style.display = "block";

        window.latestCV = data.cv;

    });
}

// ==========================
// DOWNLOAD CV
// ==========================
function downloadCV(){

    const blob = new Blob([window.latestCV], {type: "text/plain"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "improved_cv.txt";
    a.click();

    URL.revokeObjectURL(url);
}

// ==========================
// JOBS
// ==========================
function findJobs(){

    fetch("/find_jobs", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({role:"project manager"})
    })
    .then(res=>res.json())
    .then(data=>{

        const jobs = data.jobs || [];

        document.getElementById("jobs").innerHTML = jobs.map(j=>`
            <div>
                <b>${j.title}</b> — ${j.company}<br>
                <a href="${j.url}" target="_blank">Open</a>
                <hr>
            </div>
        `).join("");
    });
}

// ==========================
// STRIPE
// ==========================
function handleSubscription(){
    fetch("/create-checkout-session",{method:"POST"})
    .then(r=>r.json())
    .then(d=>window.location.href = d.url);
}

</script>

</body>
</html>
