<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HiddenEdge</title>

<style>
body { margin:0; font-family:Arial; background:#020617; color:white; }
.wrapper { display:flex; height:100vh; }
.left { width:300px; padding:20px; background:#0b1220; }
.right { flex:1; padding:20px; overflow:auto; }

.card { background:#111827; padding:18px; border-radius:12px; margin-bottom:15px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }

.robot { width:60px; }

button {
    padding:10px;
    margin-top:10px;
    background:#3b82f6;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

.secondary { background:#1e293b; }

textarea {
    width:100%;
    margin-top:8px;
    background:#020617;
    color:white;
    border:1px solid #334155;
    border-radius:6px;
    padding:8px;
}

.hidden { display:none; }

.progress-bar {
    height:6px;
    background:#1e293b;
    border-radius:5px;
    margin-top:6px;
}

.progress-fill {
    height:100%;
    width:0%;
    background:#22c55e;
    border-radius:5px;
    transition: width 0.4s ease;
}

.thinking {
    font-size:14px;
    opacity:0.8;
    margin-top:10px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity:0.3; }
    50% { opacity:1; }
    100% { opacity:0.3; }
}

.badge {
    display:inline-block;
    padding:4px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.pass { background:#065f46; color:#22c55e; }
.reject { background:#7f1d1d; color:#ef4444; }
.borderline { background:#78350f; color:#f59e0b; }
</style>
</head>

<body>

<div class="wrapper">

<div class="left">

<h2>HiddenEdge</h2>
<img src="/static/helper.png" class="robot">

<p style="font-size:13px;opacity:0.8;">
1. Upload your CV<br>
2. Paste job description<br>
3. Click Analyze
</p>

<input type="file" id="files"><br><br>
<textarea id="job_text" placeholder="Paste job description..."></textarea>

<button onclick="analyze()">Analyze My Fit</button>

<div class="card">

Upload
<div class="progress-bar"><div id="uploadBar" class="progress-fill"></div></div>

Analyze
<div class="progress-bar"><div id="analyzeBar" class="progress-fill"></div></div>

Tailor
<div class="progress-bar"><div id="tailorBar" class="progress-fill"></div></div>

<div id="thinkingBox" class="thinking hidden"></div>

</div>

</div>

<div class="right">

<div class="card">
<h3>ATS Evaluation</h3>
<div id="atsBlock"></div>
</div>

<div class="grid">

<div class="card">
<img src="/static/nestor.png" class="robot">
<h3>Recruiter Evaluation</h3>
<div id="recruiterText"></div>
</div>

<div class="card">
<img src="/static/alec.png" class="robot">
<h3>Hiring Manager Evaluation</h3>
<div id="managerText"></div>
</div>

</div>

<div class="card hidden" id="helperCTA">
<p>Answer questions to improve your match?</p>
<button onclick="showQuestions()">Yes</button>
<button class="secondary" onclick="decline()">No</button>
</div>

<div class="card hidden" id="questionsBlock">
<h3>Questions</h3>
<div id="questionsContainer"></div>
<button onclick="submitAnswers()">Submit</button>
</div>

<div class="card hidden" id="evaluationBlock">
<h3>Re-evaluation</h3>
<div id="evaluationContent"></div>
</div>

<div class="card hidden" id="improveCTA">
<p>Improve your CV?</p>
<button onclick="generateCV()">Yes</button>
<button class="secondary" onclick="decline()">No</button>
</div>

<div class="card hidden" id="cvBlock">
<h3>Improved CV</h3>
<pre id="cvOutput"></pre>
<div id="scoreBlock" style="margin-top:15px;"></div>
</div>

</div>
</div>

<script>

// ===== UX =====
let thinkingMessages = [
    "Analyzing your CV...",
    "Simulating recruiter...",
    "Evaluating hiring manager..."
];

let thinkingInterval, progressInterval;

function startThinking(){
    let i=0;
    thinkingBox.classList.remove("hidden");
    thinkingInterval=setInterval(()=>{
        thinkingBox.innerText=thinkingMessages[i++%thinkingMessages.length];
    },1500);
}

function stopThinking(){
    clearInterval(thinkingInterval);
    thinkingBox.classList.add("hidden");
}

function smoothProgress(){
    let v=0;
    progressInterval=setInterval(()=>{
        v+=Math.random()*8;
        if(v>=90) clearInterval(progressInterval);
        analyzeBar.style.width=v+"%";
    },400);
}

function finishProgress(){
    clearInterval(progressInterval);
    analyzeBar.style.width="100%";
}

// ===== STATE =====
let baseScore=0, questionsData=[], storedTexts=[];

// ===== ANALYZE =====
async function analyze(){

    let file=files.files[0];
    if(!file){ alert("Upload CV"); return; }

    uploadBar.style.width="100%";
    startThinking(); smoothProgress();

    let form=new FormData();
    form.append("files",file);
    form.append("job_text",job_text.value);

    let res=await fetch("/analyze",{method:"POST",body:form});

    if(res.status===402){
        stopThinking(); finishProgress();
        alert("Upgrade required");
        return;
    }

    let data=await res.json();

    stopThinking(); finishProgress();

    baseScore=data.fit_score||0;
    storedTexts=data.texts||[];

    renderATS(data.ats_analysis||{});
    renderRecruiter(data.recruiter_view||{});
    renderManager(data.hiring_manager_view||{});

    questionsData=data.questions||[];
    helperCTA.classList.remove("hidden");
}

// ===== RENDER =====
function getBadge(d){
    if(!d) return "";
    d=d.toLowerCase();
    if(d.includes("pass")) return '<span class="badge pass">PASS</span>';
    if(d.includes("reject")) return '<span class="badge reject">REJECT</span>';
    return '<span class="badge borderline">BORDERLINE</span>';
}

// ✅ FULL ATS DETAIL RESTORED
function renderATS(ats){

    let html = `
    <b>Score:</b> ${ats.score || "N/A"}%<br><br>
    <b>Domain:</b> ${ats.domain || ""}<br>
    <b>Role:</b> ${ats.role || ""}<br><br>
    `;

    (ats.matches || []).forEach(m=>{
        html+=`
        <div style="margin-bottom:12px;">
        <b>${m.requirement || ""}</b><br>
        Match: ${m.match || ""}<br>
        Evidence: ${m.evidence || "No evidence"}<br>
        Gap: ${m.gap || ""}
        </div>`;
    });

    atsBlock.innerHTML = html;
}

function renderRecruiter(r){
    recruiterText.innerHTML=`${getBadge(r.screening_decision)}<br>${r.reasoning||""}`;
}

function renderManager(h){
    managerText.innerHTML=`${h.final_decision||""}`;
}

// ===== QUESTIONS =====
function showQuestions(){
    helperCTA.classList.add("hidden");
    questionsBlock.classList.remove("hidden");

    questionsContainer.innerHTML=questionsData.map((q,i)=>
        `<div>${q}<textarea id="q_${i}"></textarea></div>`
    ).join("");
}

async function submitAnswers(){

    let answers=questionsData.map((_,i)=>document.getElementById("q_"+i).value);

    let res=await fetch("/evaluate_answers",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({base_score:baseScore,answers:answers.join(" ")})
    });

    let data=await res.json();

    evaluationBlock.classList.remove("hidden");

    evaluationContent.innerHTML=`
    Original: ${data.base_score}%<br>
    New: ${data.new_score}%
    `;

    improveCTA.classList.remove("hidden");
}

// ===== CV =====
function generateCV(){

    tailorBar.style.width="100%";

    cvBlock.classList.remove("hidden");

    cvOutput.innerHTML=`
    <div style="filter:blur(5px);opacity:0.6;">
    ${storedTexts.join("<br>").substring(0,800)}
    </div>

    <br><button onclick="goToCheckout()">Unlock Full CV</button>
    `;
}

async function goToCheckout(){
    let res=await fetch("/create-checkout-session",{method:"POST"});
    let data=await res.json();
    window.location.href=data.url;
}

function decline(){ location.reload(); }

</script>

</body>
</html>
